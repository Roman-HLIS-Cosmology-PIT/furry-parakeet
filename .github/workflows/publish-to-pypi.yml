
# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://github.com/pypa/gh-action-pypi-publish#trusted-publishing

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            platform: linux
            python-version: 3.12
            runs-on: ubuntu-latest
          - os: linux-arm
            platform: linux
            python-version: 3.12
            runs-on: ubuntu-24.04-arm
          - os: macos-intel
            platform: macos
            python-version: 3.12
            runs-on: macos-15-intel
          - os: linux-intel
            platform: linux
            python-version: 3.13
            runs-on: ubuntu-latest
          - os: linux-arm
            platform: linux
            python-version: 3.13
            runs-on: ubuntu-24.04-arm
          - os: macos-intel
            platform: macos
            python-version: 3.13
            runs-on: macos-15-intel
          - os: linux-intel
            platform: linux
            python-version: 3.14
            runs-on: ubuntu-latest
          - os: linux-arm
            platform: linux
            python-version: 3.14
            runs-on: ubuntu-24.04-arm
          - os: macos-intel
            platform: macos
            python-version: 3.14
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Install OpenMP-enabled Clang
        if: matrix.os == 'macos-intel'
        run: |
          brew install llvm libomp
      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clean build artifacts
        run: rm -rf build dist
      - name: Build wheels pypa step on ${{ matrix.os }} Python ${{ matrix.python-version }}
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: auto
          CIBW_OUTPUT_DIR: dist
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CC="/usr/local/opt/llvm/bin/clang"
            CXX="/usr/local/opt/llvm/bin/clang++"
            LDFLAGS="-L/usr/local/opt/llvm/lib"
            CPPFLAGS="-I/usr/local/opt/llvm/include"
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Check package distributions via Twine
        run: |
          pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
